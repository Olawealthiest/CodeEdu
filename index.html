<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGnet Tech Institute | CodeEdu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    function toggleSchoolField() {} 
    function showToast(msg) { alert(msg); } 

    function showLiveClassModal() {
        const data = JSON.parse(localStorage.getItem('ggnet_data')) || {};
        const activeClass = localStorage.getItem('ggnet_live_status') === 'live';
        showModal(`
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold text-gray-800">Schedule Live Class</h3>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form onsubmit="saveLiveClass(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Class Topic</label>
                        <input type="text" id="liveClassTopic" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Instructor's Name</label>
                        <input type="text" id="liveClassInstructor" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Class Link (Zoom/Google Meet)</label>
                        <input type="url" id="liveClassLink" required placeholder="https://meet.google.com/..." class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none">
                    </div>

                    ${activeClass ? `
                    <div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-green-800">Class is Live</p>
                                <p class="text-sm text-green-600">Topic: ${data.liveClass.topic}</p>
                            </div>
                            <span class="flex h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-3 w-3 rounded-full bg-red-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                            </span>
                        </div>
                    </div>
                    <button type="button" onclick="stopLiveClass()" class="w-full bg-gradient-to-r from-gray-600 to-gray-700 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition mb-3">
                        <i class="fas fa-stop-circle mr-2"></i>Stop Live Class
                    </button>
                    ` : ''}
                    <button type="submit" class="w-full bg-gradient-to-r from-red-500 to-orange-500 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition">
                        <i class="fas fa-broadcast-tower mr-2"></i>${activeClass ? 'Start New Class' : 'Go Live'}
                    </button>

                </div>
            </div>
        `);
    }

    function saveLiveClass(e) {
    e.preventDefault();
    const topic = document.getElementById('liveClassTopic').value.trim();
    const instructor = document.getElementById('liveClassInstructor').value.trim();
    const link = document.getElementById('liveClassLink').value.trim();
    const duration = parseInt(document.getElementById('liveClassDuration')?.value) || 60;
    
    if (!topic || !instructor || !link) {
        alert('Please fill all fields');
        return;
    }

    // Single source of truth
    localStorage.setItem('ggnet_live_status', 'live');
    localStorage.setItem('ggnet_live_topic', topic);
    localStorage.setItem('ggnet_live_instructor', instructor);
    localStorage.setItem('ggnet_live_link', link);
    localStorage.setItem('ggnet_live_started_at', Date.now());
    localStorage.setItem('ggnet_live_ends_at', Date.now() + (duration * 60 * 1000));
    
    // Keep ggnet_data.liveClass for compatibility but sync it
    const data = JSON.parse(localStorage.getItem('ggnet_data') || '{}');
    data.liveClass = {
        active: true,
        topic, instructor, link, duration,
        startedAt: new Date().toISOString()
    };
    localStorage.setItem('ggnet_data', JSON.stringify(data));
    
    closeModal();
    showToast('Live class started! Students can now join.');
    navigateTo(currentView); // Re-render, no reload
}

    function showStudentUploadModal() {
        showModal(`
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold text-gray-800">Upload Assignment</h3>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form onsubmit="saveStudentUpload(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">File Name</label>
                        <input type="text" id="studentFileName" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Upload File</label>
                        <input type="file" id="studentFileInput" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-green-500 to-blue-500 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition">
                        <i class="fas fa-upload mr-2"></i>Submit
                    </button>
                </div>
            </div>
        `);
    }

    function saveStudentUpload(e) {
        e.preventDefault();
        const data = JSON.parse(localStorage.getItem('ggnet_data'));
        const fileInput = document.getElementById('studentFileInput');
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const uploadData = {
                id: Date.now(),
                name: document.getElementById('studentFileName').value,
                student_id: currentUser.student_id,
                student_name: currentUser.name,
                data: event.target.result,
                upload_date: new Date().toISOString().split('T')[0]
            };
            if (!data.studentUploads) data.studentUploads = [];
            data.studentUploads.push(uploadData);
            localStorage.setItem('ggnet_data', JSON.stringify(data));
            closeModal();
            showToast('Assignment uploaded successfully!');
            navigateTo('resources');
        };
        reader.readAsDataURL(file);
    }

    const codeTemplates = {
        html: '<!DOCTYPE html>\n<html>\n<head>\n  <title>My Page</title>\n  <style>\n    body { font-family: Arial; padding: 20px; }\n  </style>\n</head>\n<body>\n  <h1>Hello World</h1>\n  <p>Start coding!</p>\n</body>\n</html>',
        css: 'body {\n  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n  color: white;\n  font-family: Arial, sans-serif;\n  padding: 40px;\n}\n\nh1 {\n  font-size: 3em;\n}',
        javascript: 'console.log("Hello from JavaScript!");\n\nfunction greet(name) {\n  return `Hello, ${name}!`;\n}\n\nconsole.log(greet("Student"));',
        python: 'print("Hello from Python!")\n\ndef greet(name):\n    return f"Hello, {name}!"\n\nprint(greet("Student"))',
        java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello from Java!");\n        System.out.println(greet("Student"));\n    }\n    \n    static String greet(String name) {\n        return "Hello, " + name + "!";\n    }\n}',
        csharp: 'using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello from C#!");\n        Console.WriteLine(Greet("Student"));\n    }\n    \n    static string Greet(string name) {\n        return $"Hello, {name}!";\n    }\n}',
        dotnet: 'using System;\n\nnamespace MyApp {\n    class Program {\n        static void Main(string[] args) {\n            Console.WriteLine("Hello from .NET!");\n        }\n    }\n}'
    };

    function switchLanguage() {
        const lang = document.getElementById('codeLanguage').value;
        document.getElementById('codeEditor').value = codeTemplates[lang] || '';
        document.getElementById('textOutput').textContent = '';
        document.getElementById('previewFrame').style.display = 'none';
    }

    function runCode() {
        const lang = document.getElementById('codeLanguage').value;
        const code = document.getElementById('codeEditor').value;
        const textOutput = document.getElementById('textOutput');
        const previewFrame = document.getElementById('previewFrame');
        
        if (lang === 'html' || lang === 'css') {
            previewFrame.style.display = 'block';
            textOutput.textContent = '';
            const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            if (lang === 'html') {
                iframeDoc.open();
                iframeDoc.write(code);
                iframeDoc.close();
            } else {
                iframeDoc.open();
                iframeDoc.write('<style>' + code + '</style><div style="padding:20px;"><h1>CSS Preview</h1><p>Your styles are applied here</p></div>');
                iframeDoc.close();
            }
        } else {
            previewFrame.style.display = 'none';
            textOutput.textContent = 'Language: ' + lang.toUpperCase() + '\n\n' + code + '\n\n--- Simulated Output ---\nHello from ' + lang + '!\nNote: Full compilation requires backend. This is a preview.';
        }
    }

    function clearCode() {
        document.getElementById('codeEditor').value = '';
        document.getElementById('textOutput').textContent = '';
        document.getElementById('previewFrame').style.display = 'none';
    }


    // Auto-sync live class status across tabs/dashboards
    window.addEventListener('storage', (e) => {
        if (e.key === 'ggnet_data') {
            if (typeof loadDashboard === 'function') loadDashboard();
            if (typeof renderSuperAdminDashboard === 'function') renderSuperAdminDashboard();
            if (typeof renderStudentView === 'function') renderStudentView();
            if (typeof renderStudentView === 'function') renderStudentView();
        }
    });

   

    // Notification System
    function toggleNotifications() {
        const dropdown = document.getElementById('notificationDropdown');
        dropdown.classList.toggle('hidden');
        if (!dropdown.classList.contains('hidden')) {
            loadNotifications();
        }
    }

    function loadNotifications() {
        const data = JSON.parse(localStorage.getItem('ggnet_data')) || {};
        const notifications = data.notifications || [];
        const userNotifications = notifications.filter(n => !n.readBy || !n.readBy.includes(currentUser.id));
        const list = document.getElementById('notificationList');
        const count = document.getElementById('notificationCount');
        
        if (userNotifications.length === 0) {
            list.innerHTML = '<p class="p-4 text-sm text-gray-500 text-center">No new notifications</p>';
            count.classList.add('hidden');
        } else {
            count.textContent = userNotifications.length;
            count.classList.remove('hidden');
            list.innerHTML = userNotifications.map(n => `
                <div class="p-4 hover:bg-gray-50 cursor-pointer" onclick="markAsRead(${n.id})">
                    <p class="font-semibold text-gray-800 text-sm">${n.title}</p>
                    <p class="text-xs text-gray-600 mt-1">${n.message}</p>
                    <p class="text-xs text-gray-400 mt-2">${new Date(n.timestamp).toLocaleString()}</p>
                </div>
            `).join('');
        }
    }

    function markAsRead(notifId) {
        const data = JSON.parse(localStorage.getItem('ggnet_data')) || {};
        if (!data.notifications) return;
        const notif = data.notifications.find(n => n.id === notifId);
        if (notif) {
            if (!notif.readBy) notif.readBy = [];
            if (!notif.readBy.includes(currentUser.id)) {
                notif.readBy.push(currentUser.id);
                localStorage.setItem('ggnet_data', JSON.stringify(data));
                loadNotifications();
            }
        }
    }

    function markAllRead() {
        const data = JSON.parse(localStorage.getItem('ggnet_data')) || {};
        if (!data.notifications) return;
        data.notifications.forEach(n => {
            if (!n.readBy) n.readBy = [];
            if (!n.readBy.includes(currentUser.id)) n.readBy.push(currentUser.id);
        });
        localStorage.setItem('ggnet_data', JSON.stringify(data));
        loadNotifications();
    }

    
    function sendNotification(event) {
    if(event) { 
        event.preventDefault(); 
        event.stopPropagation(); 
    }
    
    const title = document.getElementById('notifTitle').value.trim();
    const message = document.getElementById('notifMessage').value.trim();
    
    if (!title || !message) {
        alert('Please fill in both Title and Message');
        return false;
    }
    
    const data = JSON.parse(localStorage.getItem('ggnet_data') || '{}');
    if (!data.notifications) data.notifications = [];
    
    const newNotif = {
        id: Date.now(),
        title: title,
        message: message,
        timestamp: new Date().toISOString(),
        sender: currentUser.full_name || 'Admin',
        readBy: []
    };
    
    data.notifications.unshift(newNotif);
    localStorage.setItem('ggnet_data', JSON.stringify(data));
    
    document.getElementById('notifTitle').value = '';
    document.getElementById('notifMessage').value = '';
    
    showToast('Notification sent to all users!', 'success');
    loadNotifications(); // Update bell immediately
    return false;
}
    
    // Make sure showToast exists
    if (typeof showToast === 'undefined') {
        function showToast(message, type) {
            console.log('Toast:', message);
            alert(message);
        }
    }


    // Listen for new notifications
    window.addEventListener('ggnet_notification_sent', loadNotifications);
    window.addEventListener('storage', loadNotifications);
    
    // Load count on page load
    document.addEventListener('DOMContentLoaded', loadNotifications);
    
    // Live class sync fix
window.addEventListener('storage', () => {
    if (currentUser && currentUser.role === 'student' && currentView === 'dashboard') {
        navigateTo('dashboard'); // Force re-render
    }
});

</script>

        if (e.key === 'ggnet_live_status' || e.key === 'ggnet_data') {
            // If student is on dashboard, re-render to show/hide Join button
            if (currentUser && currentUser.role === 'student' && currentView === 'dashboard') {
                navigateTo('dashboard');
            }
            // If superadmin is on documents tab, update the Stop button visibility
            if (currentUser && currentUser.role === 'superadmin' && currentView === 'documents') {
                navigateTo('documents');
            }
        }
    });

    // Set logos
    document.addEventListener('DOMContentLoaded', () => {
        const logoSrc = document.getElementById('ggnet-logo').src;
        document.getElementById('loginLogo').src = logoSrc;
        document.getElementById('headerLogo').src = logoSrc;
    });

    // Login handling
    document.getElementById('roleSelect').addEventListener('change', (e) => {
        const isParent = e.target.value === 'parent';
        document.getElementById('parentFields').classList.toggle('hidden', !isParent);
        document.getElementById('loginFields').classList.toggle('hidden', isParent);
    });

    function handleLogin() {
        const role = document.getElementById('roleSelect').value;
        const data = JSON.parse(localStorage.getItem('ggnet_data'));
        
        if (role === 'parent') {
            const studentName = document.getElementById('parentStudentName').value.trim();
            const schoolName = document.getElementById('parentSchoolName').value.trim();
            
            if (!studentName || !schoolName) {
                alert('Please enter both Student Name and School Name');
                return;
            }
            
            const student = data.users.find(u => 
                u.role === 'student' && 
                u.full_name.toLowerCase() === studentName.toLowerCase() && 
                u.school_name.toLowerCase() === schoolName.toLowerCase() &&
                u.active
            );
            
            if (student) {
                currentUser = { ...student, role: 'parent' };
                showApp();
            } else {
                alert('Invalid student name or school name. Student may be suspended or not found.');
            }
        } else {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            const user = data.users.find(u => 
                u.username === username && 
                u.password === password && 
                u.role === role &&
                u.active
            );
            
            if (user) {
                currentUser = user;
                showApp();
            } else {
                alert('Invalid credentials or account suspended');
            }
        }
    }

    function handleLogout() {
        currentUser = null;
        currentView = 'dashboard';
        document.getElementById('mainApp').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        Object.values(chartInstances).forEach(chart => chart?.destroy());
        chartInstances = {};
    }

    function showApp() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('userFullName').textContent = currentUser.full_name;
        document.getElementById('userRole').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
        renderSidebar();
        navigateTo('dashboard');

    // CHART FUNCTIONS
    function renderSystemChart(data) {
        const ctx = document.getElementById('systemChart');
        if (!ctx) return;
        if (chartInstances.system) chartInstances.system.destroy();
        
        const roleCounts = {};
        data.users.forEach(u => {
            roleCounts[u.role] = (roleCounts[u.role] || 0) + 1;
        });
        
        chartInstances.system = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(roleCounts).map(r => r.charAt(0).toUpperCase() + r.slice(1)),
                datasets: [{
                    data: Object.values(roleCounts),
                    backgroundColor: ['#8B5CF6', '#3B82F6', '#10B981', '#F59E0B'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: true }
        });
    }

    function renderSchoolChart(grades) {
        const ctx = document.getElementById('schoolChart');
        if (!ctx) return;
        if (chartInstances.school) chartInstances.school.destroy();
        
        const courseAvgs = COURSES.map(course => {
            const courseGrades = grades.filter(g => g.course === course.id);
            return courseGrades.length ? (courseGrades.reduce((sum, g) => sum + g.score, 0) / courseGrades.length) : 0;
        });
        
        chartInstances.school = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: COURSES.map(c => c.name),
                datasets: [{
                    label: 'Average Score',
                    data: courseAvgs,
                    backgroundColor: ['#3B82F6', '#F97316', '#8B5CF6', '#EC4899'],
                    borderRadius: 8
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
        });
    }

    function renderCourseAvgChart(grades) {
        const ctx = document.getElementById('courseAvgChart');
        if (!ctx) return;
        if (chartInstances.courseAvg) chartInstances.courseAvg.destroy();
        
        const courseAvgs = COURSES.map(course => {
            const courseGrades = grades.filter(g => g.course === course.id);
            return courseGrades.length ? (courseGrades.reduce((sum, g) => sum + g.score, 0) / courseGrades.length) : 0;
        });
        
        chartInstances.courseAvg = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: COURSES.map(c => c.name),
                datasets: [{
                    label: 'Average Performance',
                    data: courseAvgs,
                    backgroundColor: 'rgba(139, 92, 246, 0.2)',
                    borderColor: '#8B5CF6',
                    borderWidth: 2,
                    pointBackgroundColor: '#8B5CF6'
                }]
            },

        });
    }

    function renderAttendanceChart(attendance) {
        const ctx = document.getElementById('attendanceChart');
        if (!ctx) return;
        if (chartInstances.attendance) chartInstances.attendance.destroy();
        
        const courseAtt = COURSES.map(course => {
            const courseData = attendance.filter(a => a.course === course.id);
            if (!courseData.length) return 0;
            const total = courseData.reduce((sum, a) => sum + (a.present / a.total), 0);
            return (total / courseData.length) * 100;
        });
        
        chartInstances.attendance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: COURSES.map(c => c.name),
                datasets: [{
                    label: 'Attendance %',
                    data: courseAtt,
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderColor: '#10B981',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
        });
    }

    function renderParentChart(grades) {

        });
    }

    function processBulkUpload(e) {
        e.preventDefault();
        const csvData = document.getElementById('bulkCSVData').value.trim();
        if (!csvData) return;
        
        const data = JSON.parse(localStorage.getItem('ggnet_data'));
        const lines = csvData.split('\n');
        let added = 0;
        
        lines.forEach(line => {
            const [username, full_name, email, school_name, password] = line.split(',').map(s => s.trim());
            if (username && full_name) {
                const newStudent = {
                    id: Math.max(...data.users.map(u => u.id)) + 1,
                    username,
                    full_name,
                    email: email || `${username}@ggnet.com`,
                    school_name: school_name || 'Greenfield High',
                    role: 'student',
                    password: password || 'demo123',
                    student_id: `STU${String(Math.max(...data.users.map(u => u.id)) + 1).padStart(3, '0')}`,
                    active: true
                };
                data.users.push(newStudent);
                added++;
            }
        });
        
        localStorage.setItem('ggnet_data', JSON.stringify(data));
        closeModal();
        alert(`✅ Successfully added ${added} students!`);
        navigateTo('students');
    }

    function generateCertificate() {
        const student = currentUser;
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 800;
        const ctx = canvas.getContext('2d');
        
        // Background gradient
        const gradient = ctx.createLinearGradient(0, 0, 1200, 800);
        gradient.addColorStop(0, '#667eea');
        gradient.addColorStop(1, '#764ba2');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1200, 800);
        
        // Border

    function changeSchoolPassword(e) {
        e.preventDefault();
        const current = document.getElementById('currentSchoolPass').value;
        const newPass = document.getElementById('newSchoolPass').value;
        const confirm = document.getElementById('confirmSchoolPass').value;
        
        if (current !== currentUser.password) {
            alert('❌ Current password is incorrect!');
            return;
        }
        if (newPass !== confirm) {
            alert('❌ New passwords do not match!');
            return;
        }
        if (newPass.length < 6) {
            alert('❌ Password must be at least 6 characters!');
            return;
        }
        
        const data = JSON.parse(localStorage.getItem('ggnet_data'));
        currentUser.password = newPass;
        
        const userIdx = data.users.findIndex(u => u.id === currentUser.id);
        data.users[userIdx].password = newPass;
        
        const schoolIdx = data.schools.findIndex(s => s.name === currentUser.school_name);
        if (schoolIdx >= 0) {
            data.schools[schoolIdx].password = newPass;
        }
        
        localStorage.setItem('ggnet_data', JSON.stringify(data));
        closeModal();
        alert('✅ Password changed successfully!');
    }

    function saveStudent(e, id) {
        e.preventDefault();
        const data = JSON.parse(localStorage.getItem('ggnet_data'));
        const studentData = {
            id: id || Math.max(...data.users.map(u => u.id)) + 1,
            username: document.getElementById('modalStudentUsername').value,
            full_name: document.getElementById('modalStudentName').value,
            email: document.getElementById('modalStudentEmail').value,
            school_name: document.getElementById('modalStudentSchool').value,
            password: document.getElementById('modalStudentPassword').value,
            role: 'student',
            student_id: id ? data.users.find(u => u.id === id).student_id : `STU${String(Math.max(...data.users.map(u => u.id)) + 1).padStart(3, '0')}`,
            active: document.getElementById('modalStudentActive').checked
        };
        
        if (id) {
            const idx = data.users.findIndex(u => u.id === id);
            data.users[idx] = {...data.users[idx], ...studentData};
        } else {
            data.users.push(studentData);
        }
        localStorage.setItem('ggnet_data', JSON.stringify(data));
        closeModal();
        navigateTo('students');
    }

    function runCode() {
        const lang = document.getElementById('codeLanguage').value;
        const code = document.getElementById('codeEditor').value;
        const textOutput = document.getElementById('textOutput');
        const previewFrame = document.getElementById('previewFrame');
        
        if (lang === 'html' || lang === 'css') {
            previewFrame.style.display = 'block';
            textOutput.textContent = '';
            const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            if (lang === 'html') {
                iframeDoc.open();
                iframeDoc.write(code);
                iframeDoc.close();
            } else {
                iframeDoc.open();
                iframeDoc.write('<style>' + code + '</style><div style="padding:20px;"><h1>CSS Preview</h1><p>Your styles are applied here</p></div>');
                iframeDoc.close();
            }
        } else {
            previewFrame.style.display = 'none';
            textOutput.textContent = 'Language: ' + lang.toUpperCase() + '\n\n' + code + '\n\n--- Simulated Output ---\nHello from ' + lang + '!\nNote: Full compilation requires backend. This is a preview.';
        }
    }

    window.stopLiveClass = function() {
    const data = JSON.parse(localStorage.getItem('ggnet_data') || '{}');
    
    if (!data.liveClass || !data.liveClass.active) {
        showToast('No active live class to stop');
        return;
    }
    
    // Move current class to history
    if (!data.liveClassHistory) data.liveClassHistory = [];
    data.liveClassHistory.unshift({
        ...data.liveClass,
        endedAt: new Date().toISOString(),
        endedBy: 'instructor_stop' // Mark it as normal stop
    });
    
    // End current class
    data.liveClass.active = false;
    data.liveClass.endedAt = new Date().toISOString();
    
    // Update the simple flag for student sync
    localStorage.setItem('ggnet_live_status', 'ended');
    localStorage.setItem('ggnet_live_ended_at', Date.now());
    localStorage.setItem('ggnet_data', JSON.stringify(data));
    
    showToast('Live class ended successfully');
    closeModal();
    
    // Re-render current view instead of reload
    navigateTo(currentView);
}

    localStorage.setItem('ggnet_live_topic', topic);
    localStorage.setItem('ggnet_live_instructor', instructor);
    localStorage.setItem('ggnet_live_link', link);
    localStorage.setItem('ggnet_live_started_at', Date.now());
    localStorage.setItem('ggnet_live_ends_at', Date.now() + (duration * 60 * 1000));
    
    // Keep ggnet_data.liveClass for compatibility but sync it
    const data = JSON.parse(localStorage.getItem('ggnet_data') || '{}');
    data.liveClass = {
        active: true,
        topic, instructor, link, duration,
        startedAt: new Date().toISOString()
    };
    localStorage.setItem('ggnet_data', JSON.stringify(data));
    
    closeModal();
    showToast('Live class started! Students can now join.');
    navigateTo(currentView); // Re-render, no reload

        function sendNotification(event) {
    if(event) { 
        event.preventDefault(); 
        event.stopPropagation(); 
    }
    
    const title = document.getElementById('notifTitle').value.trim();
    const message = document.getElementById('notifMessage').value.trim();
    
    if (!title || !message) {
        alert('Please fill in both Title and Message');
        return false;
    }
    
    const data = JSON.parse(localStorage.getItem('ggnet_data') || '{}');
    if (!data.notifications) data.notifications = [];
    
    const newNotif = {
        id: Date.now(),
        title: title,
        message: message,
        timestamp: new Date().toISOString(),
        sender: currentUser.full_name || 'Admin',
        readBy: []
    };
    
    data.notifications.unshift(newNotif);
    localStorage.setItem('ggnet_data', JSON.stringify(data));
    
    document.getElementById('notifTitle').value = '';
    document.getElementById('notifMessage').value = '';
